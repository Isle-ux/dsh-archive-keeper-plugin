name: 💡 功能建议 / Feature request
description: 想要新功能，或觉得某个地方可以更好用
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。这个插件的定位是「归档后自动提炼要点，去留由你自己定」，
        任何符合这个方向的想法都可以聊。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案 —— 这样我能判断有没有更合适的做法。
      placeholder: |
        例如：我归档的会话很多，逐条点"只留摘要"太累了，
        希望能一次性对某一整批应用同一个选择。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么用
      placeholder: |
        例如：在年份分组上右键，能对该组下所有未决定的会话批量选"只留摘要"。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕开的
      description: 如果有临时办法，说一下；没有就留空。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 大概属于哪一块
      options:
        - 界面 / 交互
        - 提炼质量（摘要内容）
        - 分类 / 标签 / 分组
        - 回收站
        - 安装 / 配置
        - 其他
    validations:
      required: true

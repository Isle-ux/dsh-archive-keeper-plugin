name: 🐛 报告问题 / Bug report
description: 装载失败、界面不显示、提炼不工作等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！这个插件只在 **DSH `0.2.0-rc.2`（Windows 11 桌面版）** 上验证过，
        所以下面的版本信息对定位问题很关键，麻烦尽量填全。

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 命令行执行 `dsh --version` 的结果
      placeholder: 例如 0.2.0-rc.2
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 查看插件目录下 `package.json` 里的 `version` 字段
      placeholder: 例如 1.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他（请在"补充说明"里写）
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: 你用的是哪种宿主
      description: 本插件只在带对话区的宿主（桌面版 / 网页版）生效；headless、tui 里不会激活。
      options:
        - 桌面版（Electron）
        - 网页版（dsh web）
        - headless
        - tui
        - 不确定
    validations:
      required: true

  - type: input
    id: install-method
    attributes:
      label: 你是用哪种方式装的
      placeholder: 例如 npm i github:Isle-ux/dsh-archive-keeper-plugin
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象是什么
      description: 发生了什么、你原本期望发生什么
      placeholder: |
        例如：插件装了，但对话头部没有出现「归档守护」按钮。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 把插件加进 profile 的 dsh.profile.bundles
        2. 启动 dsh web
        3. 打开任意对话
        4. 头部右侧没有出现「归档守护」
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 日志
      description: |
        启动日志里如果有带 `archive-keeper` 或 `web boot` 字样的行，请贴上来。
        没有就留空。
      render: text
    validations:
      required: false

  - type: textarea
    id: plugins
    attributes:
      label: 你还装了哪些插件
      description: |
        profile 的 `package.json` 里 `dsh.profile.bundles` 列表，或你记得的插件名。
        如果是"界面不显示"类问题，这项很重要。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认用的是桌面版或网页版（不是 headless / tui）
          required: true
        - label: 我搜索过已有的 Issue，没有重复
          required: true
